site_name: Lehrplan-Ontologie
#theme: readthedocs
#theme: mkdocs
theme:
  name: material
  logo: logo.png
  favicon: logo.png
  palette:
    primary: custom
  font:
    text: Barlow
  features:
#    - navigation.tabs
#    - navigation.sections
    - navigation.path
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

nav:
  - start: index.md
  - start: index.en.md

  - ontology: ontology.md
  - ontology: ontology.en.md

  - intro: introduction.md
  - intro: introduction.en.md

  - structure: structure.md
  - structure: structure.en.md

  - patterns: patterns.md
  - patterns: patterns.en.md

  - sparql: sparql.md
  - sparql: sparql.en.md

  - usage: usage.md
  - usage: usage.en.md

  - kg: knowledge-graph.md
  - kg: knowledge-graph.en.md

  - governance: governance.md
  - governance: governance.en.md

  - glossary: glossar.md
  - glossary: glossar.en.md

  - about: about.md
  - about: about.en.md

#  - Versions: versions.md
#  - Contributing: contributing.md
#  - Contact: contact.md

markdown_extensions:
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - md_in_html
  - pymdownx.snippets
  - admonition
  - pymdownx.details


      

plugins:
  - d2
  - search:
      lang:
        - de
        - en
  - ontoink
#  - privacy
  - i18n:
      default_language: 'de'
      languages:
        de: "Deutsch"
        en: "English"
#      no_translation:
#        en: "This page isn't translated to English."
#        de: "Diese Seite wurde nicht auf Deutsch übersetzt."
      translate_nav:
        de:
          start: "Start"
          ontology: "Einführung in Ontologien"
          intro: "Konzeptuelle Grundlagen"
          structure: "Ontologie-Modell"
          patterns: "Patterns"
          sparql: "SPARQL-Abfragen"
          usage: "Verwendung"
          kg: "Knowledge Graph"
          governance: "Governance"
          glossary: "Glossar"
          about: "Über uns"
        en:
          start: "Home"
          ontology: "Introduction to Ontologies"
          intro: "Conceptual Foundations"
          structure: "Ontology Model"
          patterns: "Patterns"
          sparql: "SPARQL Queries"
          usage: "Usage"
          kg: "Knowledge Graph"
          governance: "Governance"
          glossary: "Glossary"
          about: "About Us"

extra_css:
  - extra.css

extra:
  alternate:
    - name: "Deutsch"
      link: ""
      lang: de

    - name: "English"
      link: "index.en/"
      lang: en

repo_url: https://github.com/FWU-DE/lehrplan-ontologie