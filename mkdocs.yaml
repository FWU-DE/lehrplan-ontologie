site_name: Lehrplan-Ontologie
#theme: readthedocs
#theme: mkdocs
theme:
  name: material
  logo: logo.png
  favicon: logo.png
  palette:
    primary: custom
  font:
    text: Barlow
  features:
#    - navigation.tabs
#    - navigation.sections
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - navigation.footer
    - navigation.top
    - toc.follow
    - search.highlight
    - content.code.copy

nav:
  - start: index.md
  - start: index.en.md

  - basics:
    - ontology: ontology.md
    - ontology: ontology.en.md
    - intro: introduction.md
    - intro: introduction.en.md

  - model:
    - structure: structure.md
    - structure: structure.en.md
    - patterns: patterns.md
    - patterns: patterns.en.md

  - practice:
    - sparql: sparql.md
    - sparql: sparql.en.md
    - usage: usage.md
    - usage: usage.en.md
    - kg: knowledge-graph.md
    - kg: knowledge-graph.en.md

  - project:
    - governance: governance.md
    - governance: governance.en.md
    - glossary: glossar.md
    - glossary: glossar.en.md
    - about: about.md
    - about: about.en.md

#  - Versions: versions.md
#  - Contributing: contributing.md
#  - Contact: contact.md

markdown_extensions:
  - attr_list
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.superfences:
      preserve_tabs: true
  - md_in_html
  - pymdownx.snippets
  - admonition
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg


      

plugins:
  - d2
  - search:
      lang:
        - de
        - en
  - ontoink
#  - privacy
  - i18n:
      default_language: 'de'
      languages:
        de: "Deutsch"
        en: "English"
#      no_translation:
#        en: "This page isn't translated to English."
#        de: "Diese Seite wurde nicht auf Deutsch übersetzt."
      translate_nav:
        de:
          start: "Start"
          ontology: "Einführung in Ontologien"
          intro: "Konzeptuelle Grundlagen"
          structure: "Ontologie-Modell"
          patterns: "Patterns"
          sparql: "SPARQL-Abfragen"
          usage: "Verwendung"
          kg: "Knowledge Graph"
          governance: "Governance"
          glossary: "Glossar"
          about: "Über uns"
          basics: "Einführung"
          model: "Ontologie"
          practice: "Praxis"
          project: "Projekt"
        en:
          start: "Home"
          ontology: "Introduction to Ontologies"
          intro: "Conceptual Foundations"
          structure: "Ontology Model"
          patterns: "Patterns"
          sparql: "SPARQL Queries"
          usage: "Usage"
          kg: "Knowledge Graph"
          governance: "Governance"
          glossary: "Glossary"
          about: "About Us"
          basics: "Introduction"
          model: "Ontology"
          practice: "In Practice"
          project: "Project"

extra_css:
  - extra.css

extra:
  alternate:
    - name: "Deutsch"
      link: ""
      lang: de

    - name: "English"
      link: "index.en/"
      lang: en

repo_url: https://github.com/FWU-DE/lehrplan-ontologie